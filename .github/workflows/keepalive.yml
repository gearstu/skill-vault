# Keep the Supabase free-tier project alive.
# Free tier pauses a project after 7 days without API activity; this runs a
# lightweight REST query once a day so the project stays active.
#
# Setup:
#   1. Push this file to your repo (GitHub Actions will pick it up).
#   2. Add repo secrets: Settings -> Secrets and variables -> Actions:
#        SUPABASE_URL        = https://<your-ref>.supabase.co
#        SUPABASE_ANON_KEY   = <anon public key>   (from Supabase Settings -> API)
#   3. Run once manually (Actions -> Keep Supabase Alive -> Run workflow) to verify.
name: Keep Supabase Alive

on:
  schedule:
    # daily at 03:00 UTC (GitHub schedules can be delayed by minutes-hours;
    # the 7-day idle window makes that a non-issue)
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -o /dev/null \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/skills?select=id&limit=1"
          echo "✅ Supabase ping OK ($(date -u +%FT%TZ))"
